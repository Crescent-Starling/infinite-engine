name: CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Install locked dependencies
        run: make setup
      - name: Format, lint, type, test, documentation and build checks
        run: make check
