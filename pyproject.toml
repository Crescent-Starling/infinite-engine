[project]
name = "infinite-engine"
version = "0.1.0"
description = "Local-first knowledge exploration foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
 "pytest>=8,<10",
 "ruff>=0.9,<1",
 "mypy>=1.14,<2",
 "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/infinite_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests", "scripts"]
plugins = ["pydantic.mypy"]
